name: Materialize validated prepare_commit repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-prepare-commit-fail-closed-source
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out clean source branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: fix/prepare-commit-fail-closed-source
          fetch-depth: 0

      - name: Verify exact base and extract reviewed carrier
        shell: bash
        run: |
          set -euo pipefail
          base=667132fa7ab4a30e0c1870d791f23902ebfc6152
          carrier=47afcca96d158b8616a3b69a8a845522d0ccd0ce
          test "$(git merge-base HEAD "$base")" = "$base"
          git fetch origin "$carrier"
          git show "$carrier:.fieldwork/prepare-commit-generation-fence.patch" > "$RUNNER_TEMP/candidate.patch"
          test "$(git hash-object "$RUNNER_TEMP/candidate.patch")" = 23290f4dc852471c7f58014ce81db37f6678b5bc
          mkdir -p src/indexer/index_writer
          git show "$carrier:src/indexer/index_writer/prepare_commit_generation_fence.rs" > src/indexer/index_writer/prepare_commit_generation_fence.rs
          test "$(git hash-object src/indexer/index_writer/prepare_commit_generation_fence.rs)" = 3b44c47386431b85d514cfc952357a12315a167a
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/indexer/index_writer.rs src/indexer/index_writer/prepare_commit_generation_fence.rs "

      - name: Install Rust and formatter
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.88.0
          profile: minimal
          override: true
      - name: Install project-policy formatter
        run: rustup toolchain install nightly-2025-06-26 --profile minimal --component rustfmt

      - name: Re-run focused repair controls
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +nightly-2025-06-26 --edition 2021 --check \
            src/indexer/index_writer.rs \
            src/indexer/index_writer/prepare_commit_generation_fence.rs
          test ! -e Cargo.lock
          cargo +1.88.0 generate-lockfile
          cargo +1.88.0 test --lib --locked --no-default-features -- --list > /tmp/tantivy-lib-tests.txt
          run_exact_test() {
            local test_name="$1"
            grep -Fx "${test_name}: test" /tmp/tantivy-lib-tests.txt
            cargo +1.88.0 test --lib --locked --no-default-features "$test_name" -- --exact --nocapture
          }
          prefix=indexer::index_writer::prepare_commit_generation_fence
          run_exact_test "${prefix}::prepare_commit_failure_rolls_back_before_returning_and_rebuilds_workers"
          run_exact_test "${prefix}::replacement_spawn_failure_rolls_back_partial_generation"
          run_exact_test "${prefix}::rollback_failure_preserves_primary_error_and_blocks_admission"

      - name: Publish source-only branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          git rm .github/workflows/materialize-prepare-commit-fail-closed-source.yml
          git add src/indexer/index_writer.rs src/indexer/index_writer/prepare_commit_generation_fence.rs
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/materialize-prepare-commit-fail-closed-source.yml src/indexer/index_writer.rs src/indexer/index_writer/prepare_commit_generation_fence.rs "
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(indexer): fail closed when prepare_commit settlement fails'
          git push origin HEAD:fix/prepare-commit-fail-closed-source
