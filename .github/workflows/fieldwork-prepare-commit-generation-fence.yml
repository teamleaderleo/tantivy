name: Fieldwork prepare-commit fail-closed repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/indexer/index_writer/prepare_commit_generation_fence.rs'
      - '.fieldwork/prepare-commit-generation-fence.patch'
      - '.fieldwork/prepare-commit-generation-fence.md'
      - '.github/workflows/fieldwork-prepare-commit-generation-fence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust 1.88
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.88.0
          profile: minimal
          override: true

      - name: Install project-policy formatter
        run: |
          rustup toolchain install nightly-2025-06-26 \
            --profile minimal \
            --component rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Apply exact repair and test registration
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git apply --check .fieldwork/prepare-commit-generation-fence.patch
          git apply .fieldwork/prepare-commit-generation-fence.patch
          git diff --check

      - name: Check candidate source and regression formatting
        run: |
          rustfmt +nightly-2025-06-26 --edition 2021 --check \
            src/indexer/index_writer.rs \
            src/indexer/index_writer/prepare_commit_generation_fence.rs

      - name: Resolve one exact dependency graph
        run: |
          test ! -e Cargo.lock
          cargo +1.88.0 generate-lockfile
          cargo +1.88.0 metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          echo "Cargo.lock sha256: $(sha256sum Cargo.lock | cut -d' ' -f1)"
          echo "cargo metadata sha256: $(sha256sum /tmp/cargo-metadata.json | cut -d' ' -f1)"
          echo "repair patch sha256: $(sha256sum .fieldwork/prepare-commit-generation-fence.patch | cut -d' ' -f1)"

      - name: Run fail-closed generation-fence regressions
        run: |
          cargo +1.88.0 test --lib --locked --no-default-features -- --list \
            > /tmp/tantivy-lib-tests.txt

          run_exact_test() {
            local test_name="$1"
            grep -Fx "${test_name}: test" /tmp/tantivy-lib-tests.txt
            cargo +1.88.0 test --lib --locked --no-default-features \
              "${test_name}" -- --exact --nocapture
          }

          prefix=indexer::index_writer::prepare_commit_generation_fence
          run_exact_test "${prefix}::prepare_commit_failure_rolls_back_before_returning_and_rebuilds_workers"
          run_exact_test "${prefix}::replacement_spawn_failure_rolls_back_partial_generation"
          run_exact_test "${prefix}::rollback_failure_preserves_primary_error_and_blocks_admission"

      - name: Run exact adjacent prepare and rollback controls
        run: |
          cargo +1.88.0 test --lib --locked --no-default-features -- --list \
            > /tmp/tantivy-lib-tests.txt

          run_exact_test() {
            local test_name="$1"
            grep -Fx "${test_name}: test" /tmp/tantivy-lib-tests.txt
            cargo +1.88.0 test --lib --locked --no-default-features \
              "${test_name}" -- --exact
          }

          run_exact_test indexer::index_writer::tests::test_prepare_with_commit_message
          run_exact_test indexer::index_writer::tests::test_prepare_but_rollback
          run_exact_test indexer::index_writer::tests::test_delete_all_documents_rollback_correct_stamp
          run_exact_test indexer::index_writer::tests::test_delete_all_documents_and_rollback
