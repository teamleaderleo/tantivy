name: Fieldwork prepare-commit generation fence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/indexer/index_writer/prepare_commit_generation_fence.rs'
      - '.fieldwork/prepare-commit-generation-fence.patch'
      - '.fieldwork/prepare-commit-generation-fence.md'
      - '.github/workflows/fieldwork-prepare-commit-generation-fence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust 1.86
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.86.0
          profile: minimal
          components: rustfmt
          override: true

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Apply exact test-module registration
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git apply --check .fieldwork/prepare-commit-generation-fence.patch
          git apply .fieldwork/prepare-commit-generation-fence.patch
          git diff --check

      - name: Check added test formatting
        run: >-
          rustfmt +1.86.0 --edition 2021 --check
          src/indexer/index_writer/prepare_commit_generation_fence.rs

      - name: Run generation-fence characterization
        run: |
          cargo +1.86.0 test --lib \
            prepare_commit_failure_leaves_next_generation_live_and_accepts_late_old_segment \
            --locked --no-default-features -- --nocapture

      - name: Run adjacent prepare and rollback controls
        run: |
          cargo +1.86.0 test --lib test_prepare_ --locked --no-default-features
          cargo +1.86.0 test --lib test_rollback --locked --no-default-features
