name: PR2999 settle all old-epoch flushes

on:
  pull_request:
    branches:
      - fieldwork/pr2999-base
    paths:
      - '.fieldwork/add_pr2999_settle_all_flushes.py'
      - '.fieldwork/pr2999-settle-all-flushes.patch'
      - '.fieldwork/pr2999_settle_all_flushes.rs'
      - '.github/workflows/pr2999-settle-all-flushes.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact PR2999 base and carrier fence
        shell: bash
        run: |
          set -euo pipefail
          base=039e02e00af3befe4a17e679af6fedfcfdee3d44
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base HEAD "$base")" = "$base"
          test -z "$(git diff --name-only "$base"...HEAD -- src/indexer/index_writer.rs src/indexer/index_writer_status.rs)"
          actual="$(git diff --name-only "$base"...HEAD | sort | tr '\n' ' ')"
          expected=".fieldwork/add_pr2999_settle_all_flushes.py .fieldwork/pr2999-settle-all-flushes.patch .fieldwork/pr2999_settle_all_flushes.rs .github/workflows/pr2999-settle-all-flushes.yml "
          test "$actual" = "$expected"

      - name: Materialize candidate and regression
        shell: bash
        run: |
          set -euo pipefail
          python .fieldwork/add_pr2999_settle_all_flushes.py \
            src/indexer/index_writer.rs \
            .fieldwork/pr2999-settle-all-flushes.patch \
            .fieldwork/pr2999_settle_all_flushes.rs
          git add -N src/indexer/index_writer/fieldwork_pr2999_settle_all_flushes.rs
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/indexer/index_writer.rs src/indexer/index_writer/fieldwork_pr2999_settle_all_flushes.rs "

      - name: Install exact Rust and formatter
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: 1.88.0
          profile: minimal
          override: true
      - name: Install pinned rustfmt
        run: rustup toolchain install nightly-2025-06-26 --profile minimal --component rustfmt

      - name: Build locked graph and enumerate exact tests
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +nightly-2025-06-26 --edition 2021 --check \
            src/indexer/index_writer.rs \
            src/indexer/index_writer/fieldwork_pr2999_settle_all_flushes.rs
          test ! -e Cargo.lock
          cargo +1.88.0 generate-lockfile
          cargo +1.88.0 test --lib --locked --no-default-features -- --list > "$RUNNER_TEMP/tantivy-lib-tests.txt"
          grep -Fx 'indexer::index_writer::fieldwork_pr2999_settle_all_flushes::prepare_commit_failure_waits_for_every_old_epoch_flush: test' "$RUNNER_TEMP/tantivy-lib-tests.txt"
          grep -Fx 'indexer::index_writer::tests::test_prepare_with_commit_message: test' "$RUNNER_TEMP/tantivy-lib-tests.txt"
          grep -Fx 'indexer::index_writer::tests::test_prepare_but_rollback: test' "$RUNNER_TEMP/tantivy-lib-tests.txt"

      - name: Execute exact repair discriminator
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 test --lib --locked --no-default-features \
            indexer::index_writer::fieldwork_pr2999_settle_all_flushes::prepare_commit_failure_waits_for_every_old_epoch_flush \
            -- --exact --nocapture

      - name: Execute adjacent successful-prepare controls
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 test --lib --locked --no-default-features \
            indexer::index_writer::tests::test_prepare_with_commit_message \
            -- --exact --nocapture
          cargo +1.88.0 test --lib --locked --no-default-features \
            indexer::index_writer::tests::test_prepare_but_rollback \
            -- --exact --nocapture

      - name: Final carrier hygiene
        shell: bash
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/indexer/index_writer.rs src/indexer/index_writer/fieldwork_pr2999_settle_all_flushes.rs "
